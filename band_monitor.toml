# band_monitor の設定ファイル
#
# 使いたい行の先頭の # を消して値を書く。書いた項目だけが既定値を上書きし、
# 起動時にコマンドラインで指定したものはさらにそれより優先される。
# 項目名は band_monitor.py --help のオプション名（先頭の -- を取ったもの）。
# 文字列は "..." で囲む。UTF-8（BOM なし）で保存すること（Windows 11 のメモ帳の既定でよい）。

# ---- 基本 ----
# port = "COM14"            # 省略時は Espressif の USB を自動検出
# gain = 40                 # 近くの VTX で山が横に広がるなら下げる（C5 実測: 55 以上で飽和）
# channels = ["E2", "E1", "F3", "F5"]   # "R1,R4" のような文字列でも可

# ---- 測定 ----
# min-snr = 18              # 信号ありと判定するフロアからの高さ dB
# avg-ms = 3000             # 平均時間 ms
# dev-ok = 0.5              # ずれ表示が青になる範囲 MHz
# dev-warn = 1.0            # ずれ表示が赤になる境界 MHz

# ---- 表示 ----
# y-range = "-90:-20"       # スペクトラム縦軸を固定
# wf-row-ms = 500           # ウォーターフォール 1 行の時間 ms
# no-hops = true            # ホップ位置の点線を消す

# ---- 記録 ----
# csv = "centres.csv"       # 実測中心を CSV に記録
